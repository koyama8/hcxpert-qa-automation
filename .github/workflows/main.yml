name: Testes E2E - Cypress

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      CYPRESS_email: ${{ secrets.TEST_USER_EMAIL }}
      CYPRESS_senha: ${{ secrets.TEST_USER_PASSWORD }}

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Registrar inicio da execucao
        shell: bash
        run: echo "EXECUTION_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restaurar cache do binario Cypress
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias
        shell: bash
        run: |
          mkdir -p security/reports
          npm audit --json --audit-level=high > security/reports/npm-audit.json

      - name: Validar qualidade estatica
        run: npm run lint

      - name: Registrar ambiente de execucao
        run: |
          node --version
          npm --version
          npx cypress version
          npx cypress cache path
          npx cypress cache list

      - name: Verificar binario Cypress
        run: npm run cy:verify

      - name: Verificar disponibilidade do Automation Exercise
        id: automation-exercise
        shell: bash
        run: |
          api_body="$(mktemp)"
          page_body="$(mktemp)"
          trap 'rm -f "$api_body" "$page_body"' EXIT

          api_available=false
          page_available=false

          if curl --fail --silent --show-error --location \
            --retry 2 --retry-delay 2 \
            https://www.automationexercise.com/api/productsList \
            --output "$api_body"; then
            if jq --exit-status \
              '.responseCode == 200 and (.products | type == "array" and length > 0)' \
              "$api_body" > /dev/null; then
              api_available=true
            fi
          fi

          if curl --fail --silent --show-error --location \
            --retry 2 --retry-delay 2 \
            https://www.automationexercise.com/login \
            --output "$page_body"; then
            if grep --quiet 'data-qa="login-email"' "$page_body"; then
              page_available=true
            fi
          fi

          if [[ "$api_available" == "true" && "$page_available" == "true" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "mode=FULL" >> "$GITHUB_OUTPUT"
            echo "EXECUTION_MODE=FULL" >> "$GITHUB_ENV"
            echo "Automation Exercise disponivel para a suite completa."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "mode=DEGRADED" >> "$GITHUB_OUTPUT"
            echo "EXECUTION_MODE=DEGRADED" >> "$GITHUB_ENV"
            echo "::warning title=Dependencia externa indisponivel::Automation Exercise bloqueou ou alterou a resposta para o GitHub Runner. A suite externa e o cenario k6 correspondente nao serao executados; os testes independentes permanecem obrigatorios."
          fi

      - name: Executar testes de login, busca, carrinho, checkout e API
        id: full_suite
        if: steps.automation-exercise.outputs.available == 'true'
        run: npm run test:all

      - name: Executar teste independente de API
        id: fallback_suite
        if: steps.automation-exercise.outputs.available != 'true'
        run: npm run test:ci:independent

      - name: Gerar relatorio Cucumber HTML
        id: cucumber_report
        if: always()
        run: npm run report

      - name: Configurar k6
        if: always()
        uses: grafana/setup-k6-action@v1

      - name: Executar teste de performance k6
        id: k6_main
        if: always()
        env:
          K6_PROFILE: ${{ github.event_name == 'pull_request' && 'smoke' || 'full' }}
          K6_AUTOMATION_EXERCISE_AVAILABLE: ${{ steps.automation-exercise.outputs.available }}
          K6_WEB_DASHBOARD: "true"
          K6_WEB_DASHBOARD_PORT: "-1"
          K6_WEB_DASHBOARD_PERIOD: "1s"
          K6_WEB_DASHBOARD_EXPORT: performance/results/k6-report.html
        run: |
          mkdir -p performance/results
          k6 run --summary-export=performance/results/k6-summary.json performance/k6_api_test.js

      - name: Executar perfil de conformidade k6
        id: k6_challenge
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          K6_PROFILE: challenge
          K6_WEB_DASHBOARD: "true"
          K6_WEB_DASHBOARD_PORT: "-1"
          K6_WEB_DASHBOARD_PERIOD: "1s"
          K6_WEB_DASHBOARD_EXPORT: performance/results/challenge/k6-report.html
        shell: bash
        run: |
          mkdir -p performance/results/challenge
          printf '%s\n' \
            '{"profile":"challenge","executor":"constant-vus","vus":10,"duration":"30s","endpoint":"trello_action","p95_limit_ms":800}' \
            > performance/results/challenge/execution-profile.json
          k6 run \
            --summary-export=performance/results/challenge/k6-summary.json \
            performance/k6_api_test.js

      - name: Executar auditoria Lighthouse
        id: lighthouse
        if: always()
        run: npm run test:lighthouse

      - name: Classificar cobertura e elegibilidade da execucao
        if: always()
        shell: bash
        env:
          FULL_SUITE_OUTCOME: ${{ steps.full_suite.outcome }}
          FALLBACK_SUITE_OUTCOME: ${{ steps.fallback_suite.outcome }}
          K6_MAIN_OUTCOME: ${{ steps.k6_main.outcome }}
          K6_CHALLENGE_OUTCOME: ${{ steps.k6_challenge.outcome }}
          LIGHTHOUSE_OUTCOME: ${{ steps.lighthouse.outcome }}
          CUCUMBER_REPORT_OUTCOME: ${{ steps.cucumber_report.outcome }}
          IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          full_suite_outcome="${FULL_SUITE_OUTCOME:-skipped}"
          fallback_suite_outcome="${FALLBACK_SUITE_OUTCOME:-skipped}"
          k6_main_outcome="${K6_MAIN_OUTCOME:-skipped}"
          k6_challenge_outcome="${K6_CHALLENGE_OUTCOME:-skipped}"
          lighthouse_outcome="${LIGHTHOUSE_OUTCOME:-skipped}"
          cucumber_report_outcome="${CUCUMBER_REPORT_OUTCOME:-skipped}"

          full_suite_executed=false
          full_suite_passed=false
          required_gates_passed=false
          release_eligible=false
          degraded_reason=""

          if [[ "$EXECUTION_MODE" == "FULL" && "$full_suite_outcome" != "skipped" ]]; then
            full_suite_executed=true
          fi

          if [[ "$EXECUTION_MODE" == "FULL" && "$full_suite_outcome" == "success" ]]; then
            full_suite_passed=true
          fi

          if [[ "$EXECUTION_MODE" == "DEGRADED" ]]; then
            degraded_reason="automation_exercise_unavailable_or_blocked"
          fi

          if [[ "$IS_MAIN_PUSH" == "true" \
            && "$full_suite_passed" == "true" \
            && "$k6_main_outcome" == "success" \
            && "$k6_challenge_outcome" == "success" \
            && "$lighthouse_outcome" == "success" \
            && "$cucumber_report_outcome" == "success" ]]; then
            required_gates_passed=true
            release_eligible=true
          fi

          echo "FULL_SUITE_EXECUTED=$full_suite_executed" >> "$GITHUB_ENV"
          echo "FULL_SUITE_PASSED=$full_suite_passed" >> "$GITHUB_ENV"
          echo "REQUIRED_GATES_PASSED=$required_gates_passed" >> "$GITHUB_ENV"
          echo "RELEASE_ELIGIBLE=$release_eligible" >> "$GITHUB_ENV"
          echo "DEGRADED_REASON=$degraded_reason" >> "$GITHUB_ENV"
          echo "FULL_SUITE_OUTCOME=$full_suite_outcome" >> "$GITHUB_ENV"
          echo "FALLBACK_SUITE_OUTCOME=$fallback_suite_outcome" >> "$GITHUB_ENV"
          echo "K6_MAIN_OUTCOME=$k6_main_outcome" >> "$GITHUB_ENV"
          echo "K6_CHALLENGE_OUTCOME=$k6_challenge_outcome" >> "$GITHUB_ENV"
          echo "LIGHTHOUSE_OUTCOME=$lighthouse_outcome" >> "$GITHUB_ENV"
          echo "CUCUMBER_REPORT_OUTCOME=$cucumber_report_outcome" >> "$GITHUB_ENV"

          mkdir -p cypress/evidencias
          printf '{\n  "executionMode": "%s",\n  "fullSuiteExecuted": %s,\n  "fullSuitePassed": %s,\n  "requiredGatesPassed": %s,\n  "releaseEligible": %s,\n  "degradedReason": "%s"\n}\n' \
            "$EXECUTION_MODE" \
            "$full_suite_executed" \
            "$full_suite_passed" \
            "$required_gates_passed" \
            "$release_eligible" \
            "$degraded_reason" \
            > cypress/evidencias/execution-mode.json

          echo "### Modo de execucao: $EXECUTION_MODE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Suite completa executada: $full_suite_executed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Suite completa aprovada: $full_suite_passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gates obrigatorios aprovados: $required_gates_passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Elegivel para release: $release_eligible" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$EXECUTION_MODE" == "DEGRADED" ]]; then
            echo "- Motivo: Automation Exercise indisponivel ou bloqueado para o runner." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Gerar metadados da execucao
        if: always()
        env:
          CYPRESS_BROWSER: electron
        run: npm run metadata

      - name: Aplicar quality gate automatico da main
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [[ "$RELEASE_ELIGIBLE" != "true" ]]; then
            echo "::error title=Evidencia nao elegivel para release::Modo=$EXECUTION_MODE; suite_completa=$FULL_SUITE_PASSED; gates=$REQUIRED_GATES_PASSED"
            exit 1
          fi

          echo "Quality gate aprovado: execucao FULL e gates obrigatorios verdes."

      - name: Salvar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-e2e
          path: |
            cypress/evidencias
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
          retention-days: 30

      - name: Salvar auditoria de dependencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-dependencias
          path: security/reports/npm-audit.json
          if-no-files-found: warn
          retention-days: 30

      - name: Salvar evidencias de performance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-performance
          path: performance/results
          if-no-files-found: warn
          retention-days: 30

      - name: Salvar evidencias do perfil de conformidade k6
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-performance-challenge
          path: performance/results/challenge
          if-no-files-found: error
          retention-days: 30

      - name: Salvar evidencias Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-lighthouse
          path: performance/lighthouse
          if-no-files-found: warn
          retention-days: 30

      - name: Preparar relatorio para o GitHub Pages
        if: always() && env.RELEASE_ELIGIBLE == 'true'
        shell: bash
        run: |
          mkdir -p pages
          cp cypress/evidencias/cucumber-report.html pages/index.html
          cp cypress/evidencias/cucumber-report.json pages/cucumber-report.json
          if [ -f performance/results/k6-report.html ]; then
            cp performance/results/k6-report.html pages/performance.html
          fi
          if [ -f performance/results/k6-summary.json ]; then
            cp performance/results/k6-summary.json pages/k6-summary.json
          fi
          if [ -f performance/lighthouse/lighthouse-report.html ]; then
            cp performance/lighthouse/lighthouse-report.html pages/lighthouse.html
          fi
          if [ -f performance/lighthouse/lighthouse-summary.json ]; then
            cp performance/lighthouse/lighthouse-summary.json pages/lighthouse-summary.json
          fi

      - name: Configurar GitHub Pages
        if: always() && env.RELEASE_ELIGIBLE == 'true'
        uses: actions/configure-pages@v5

      - name: Empacotar relatorio do GitHub Pages
        if: always() && env.RELEASE_ELIGIBLE == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  publicar-relatorio:
    name: Publicar relatorio no GitHub Pages
    if: needs.testes-e2e.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: testes-e2e
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: github-pages
      cancel-in-progress: true

    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  seguranca-dast:
    name: Seguranca DAST - OWASP ZAP Baseline
    needs: testes-e2e
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Executar baseline passivo OWASP ZAP
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: https://www.automationexercise.com
          rules_file_name: security/owasp_zap_config.conf
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          cmd_options: -I -m 1
          fail_action: true
          allow_issue_writing: false
          artifact_name: evidencias-seguranca-zap
