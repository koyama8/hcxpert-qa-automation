name: Testes E2E - Cypress

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      CYPRESS_email: ${{ secrets.TEST_USER_EMAIL }}
      CYPRESS_senha: ${{ secrets.TEST_USER_PASSWORD }}

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Registrar inicio da execucao
        shell: bash
        run: echo "EXECUTION_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restaurar cache do binario Cypress
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias
        shell: bash
        run: |
          mkdir -p security/reports
          npm audit --json --audit-level=high > security/reports/npm-audit.json

      - name: Validar qualidade estatica
        run: npm run lint

      - name: Registrar ambiente de execucao
        run: |
          node --version
          npm --version
          npx cypress version
          npx cypress cache path
          npx cypress cache list

      - name: Verificar binario Cypress
        run: npm run cy:verify

      - name: Verificar disponibilidade do Automation Exercise
        id: automation-exercise
        shell: bash
        run: |
          api_body="$(mktemp)"
          page_body="$(mktemp)"
          trap 'rm -f "$api_body" "$page_body"' EXIT

          api_available=false
          page_available=false

          if curl --fail --silent --show-error --location \
            --retry 2 --retry-delay 2 \
            https://www.automationexercise.com/api/productsList \
            --output "$api_body"; then
            if jq --exit-status \
              '.responseCode == 200 and (.products | type == "array" and length > 0)' \
              "$api_body" > /dev/null; then
              api_available=true
            fi
          fi

          if curl --fail --silent --show-error --location \
            --retry 2 --retry-delay 2 \
            https://www.automationexercise.com/login \
            --output "$page_body"; then
            if grep --quiet 'data-qa="login-email"' "$page_body"; then
              page_available=true
            fi
          fi

          if [[ "$api_available" == "true" && "$page_available" == "true" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Automation Exercise disponivel para a suite completa."
            echo "### Dependencia externa: disponivel" >> "$GITHUB_STEP_SUMMARY"
            echo "A suite Cypress e o k6 executarao todos os fluxos configurados." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Dependencia externa indisponivel::Automation Exercise bloqueou ou alterou a resposta para o GitHub Runner. A suite externa e o cenario k6 correspondente nao serao executados; os testes independentes permanecem obrigatorios."
            echo "### Dependencia externa: indisponivel" >> "$GITHUB_STEP_SUMMARY"
            echo "O Automation Exercise bloqueou ou alterou a resposta para o GitHub Runner." >> "$GITHUB_STEP_SUMMARY"
            echo "Foram executados somente os testes independentes; os cenarios externos permanecem cobertos pela execucao local completa." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Executar testes de login, busca, carrinho, checkout e API
        if: steps.automation-exercise.outputs.available == 'true'
        run: npm run test:all

      - name: Executar teste independente de API
        if: steps.automation-exercise.outputs.available != 'true'
        run: npm run test:ci:independent

      - name: Gerar relatorio Cucumber HTML
        if: always()
        run: npm run report

      - name: Configurar k6
        if: always()
        uses: grafana/setup-k6-action@v1

      - name: Executar teste de performance k6
        if: always()
        env:
          K6_PROFILE: ${{ github.event_name == 'pull_request' && 'smoke' || 'full' }}
          K6_AUTOMATION_EXERCISE_AVAILABLE: ${{ steps.automation-exercise.outputs.available }}
          K6_WEB_DASHBOARD: "true"
          K6_WEB_DASHBOARD_PORT: "-1"
          K6_WEB_DASHBOARD_PERIOD: "1s"
          K6_WEB_DASHBOARD_EXPORT: performance/results/k6-report.html
        run: |
          mkdir -p performance/results
          k6 run --summary-export=performance/results/k6-summary.json performance/k6_api_test.js

      - name: Executar auditoria Lighthouse
        if: always()
        run: npm run test:lighthouse

      - name: Gerar metadados da execucao
        if: always()
        env:
          CYPRESS_BROWSER: electron
        run: npm run metadata

      - name: Salvar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-e2e
          path: |
            cypress/evidencias
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
          retention-days: 30

      - name: Salvar auditoria de dependencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-dependencias
          path: security/reports/npm-audit.json
          if-no-files-found: warn
          retention-days: 30

      - name: Salvar evidencias de performance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-performance
          path: performance/results
          if-no-files-found: warn
          retention-days: 30

      - name: Salvar evidencias Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-lighthouse
          path: performance/lighthouse
          if-no-files-found: warn
          retention-days: 30

      - name: Preparar relatorio para o GitHub Pages
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p pages
          cp cypress/evidencias/cucumber-report.html pages/index.html
          cp cypress/evidencias/cucumber-report.json pages/cucumber-report.json
          if [ -f performance/results/k6-report.html ]; then
            cp performance/results/k6-report.html pages/performance.html
          fi
          if [ -f performance/results/k6-summary.json ]; then
            cp performance/results/k6-summary.json pages/k6-summary.json
          fi
          if [ -f performance/lighthouse/lighthouse-report.html ]; then
            cp performance/lighthouse/lighthouse-report.html pages/lighthouse.html
          fi
          if [ -f performance/lighthouse/lighthouse-summary.json ]; then
            cp performance/lighthouse/lighthouse-summary.json pages/lighthouse-summary.json
          fi

      - name: Configurar GitHub Pages
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Empacotar relatorio do GitHub Pages
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  publicar-relatorio:
    name: Publicar relatorio no GitHub Pages
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: testes-e2e
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: github-pages
      cancel-in-progress: true

    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  seguranca-dast:
    name: Seguranca DAST - OWASP ZAP Baseline
    needs: testes-e2e
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Executar baseline passivo OWASP ZAP
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: https://www.automationexercise.com
          rules_file_name: security/owasp_zap_config.conf
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          cmd_options: -I -m 1
          fail_action: true
          allow_issue_writing: false
          artifact_name: evidencias-seguranca-zap
